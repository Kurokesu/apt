# Archive badge state: green when the last publish built current main, orange
# when main moved past it, red when the last publish failed. Writes a shields
# endpoint JSON to the orphan `badges` branch.
#
# workflow_run matches the publish workflow display name. Rename together with
# publish.yml or the badge freezes.
name: Badge

on:
  workflow_run:
    workflows: [Publish APT archive]
    types: [completed]
  push:
    branches: [main]
    # Pushes that cannot change served content should not flip the badge.
    paths-ignore:
      - README.md
      - LICENSE
      - ".github/**"
  # Manual re-sync.
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# Every trigger force-pushes the badges branch, serialize the writers.
concurrency:
  group: badge
  cancel-in-progress: false

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      # Sticky red: a failed publish is more actionable than staleness.
      - name: Compute badge state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PUBLISHED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          if [ "$EVENT" = workflow_run ]; then
            case "$CONCLUSION" in
              success)
                published="$PUBLISHED_SHA"
                ;;
              failure)
                echo "message=publish failed" >> "$GITHUB_OUTPUT"
                echo "color=red" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              *)
                # Cancelled runs change nothing served.
                echo "skip=1" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          else
            run=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/runs?status=completed&per_page=1" \
              --jq '.workflow_runs[0] | "\(.conclusion) \(.head_sha)"')
            if [ -z "$run" ]; then
              echo "message=not published" >> "$GITHUB_OUTPUT"
              echo "color=lightgrey" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            conclusion=${run%% *}
            published=${run##* }
            if [ "$conclusion" != success ]; then
              echo "message=publish failed" >> "$GITHUB_OUTPUT"
              echo "color=red" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Live main, not the event payload, closes the in-flight publish race.
          if [ "$published" = "$main_sha" ]; then
            echo "message=up to date" >> "$GITHUB_OUTPUT"
            echo "color=brightgreen" >> "$GITHUB_OUTPUT"
          else
            echo "message=behind main" >> "$GITHUB_OUTPUT"
            echo "color=orange" >> "$GITHUB_OUTPUT"
          fi

      - name: Push badge JSON
        if: steps.state.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.state.outputs.message }}
          COLOR: ${{ steps.state.outputs.color }}
        run: |
          dir=$(mktemp -d)
          cd "$dir"
          git init -q -b badges
          printf '{"schemaVersion": 1, "label": "archive", "message": "%s", "color": "%s", "cacheSeconds": 300}\n' \
            "$MESSAGE" "$COLOR" > publish.json
          git add publish.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "archive: $MESSAGE"
          git push -q --force \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" badges
